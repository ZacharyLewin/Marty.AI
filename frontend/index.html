<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marty AI — McGill AIdvisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    /* ── reset & tokens ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:        #D4001E;
      --red-dark:   #A8001A;
      --white:      #FFFFFF;
      --cream:      #F5F0EB;
      --gray:       #8C8C8C;
      --near-black: #1A1A1A;
      --border:     #E2DCD6;
      --shadow:     0 2px 12px rgba(0,0,0,.08);
      --radius:     14px;
      --max-w:      680px;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--near-black);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── page shells ────────────────────────────────────────────────── */
    #welcome-screen,
    #chat-screen {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    #chat-screen { display: none; }

    /* ── welcome screen ─────────────────────────────────────────────── */
    #welcome-screen {
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 7rem; /* bottom pad makes room for fixed input on mobile */
      text-align: center;
    }

    #welcome-logo {
      width: 120px; height: 120px;
      margin: 0 auto 1rem;
      display: grid; place-items: center;
    }

    #welcome-logo img {
      width: 120px; height: 120px;
      object-fit: contain;
    }

    #welcome-heading {
      font-family: 'Stratum2', 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(5rem, 18vw, 10rem);
      color: var(--red);
      letter-spacing: -.02em;
      line-height: .95;
      margin-bottom: .75rem;
    }

    #welcome-sub {
      font-size: 1rem;
      font-weight: 400;
      color: var(--gray);
      max-width: 400px;
      line-height: 1.55;
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* ── shared input bar ───────────────────────────────────────────── */
    /* desktop: inline below welcome heading */
    #welcome-input-wrap {
      width: 100%;
      max-width: var(--max-w);
    }

    /* mobile: fixed to bottom */
    @media (max-width: 640px) {
      #welcome-input-wrap {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        max-width: 100%;
        background: var(--cream);
        border-top: 1px solid var(--border);
        padding: .75rem 1rem 1rem;
      }
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: .55rem .5rem .55rem 1.25rem;
      box-shadow: var(--shadow);
      transition: border-color .15s;
      cursor: text;
    }

    .input-row:focus-within {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(212,0,30,.1);
    }

    .input-row textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      color: var(--near-black);
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
    }

    /* center text only on the welcome input */
    #welcome-input-wrap .input-row textarea {
      text-align: center;
    }

    .input-row textarea::placeholder {
      color: var(--gray);
      font-style: italic;
    }

    .send-btn {
      flex-shrink: 0;
      width: 38px; height: 38px;
      background: var(--red);
      border: none;
      border-radius: 999px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    .send-btn:hover:not(:disabled) { background: var(--red-dark); }
    .send-btn:disabled { opacity: .35; cursor: not-allowed; }
    .send-btn svg { width: 17px; height: 17px; stroke: white; fill: none; }

    .input-hint {
      text-align: center;
      font-size: .7rem;
      color: var(--gray);
      margin-top: .45rem;
    }

    /* ── chat screen ────────────────────────────────────────────────── */
    #chat-screen {
      position: fixed;
      inset: 0;
      background: var(--cream);
    }

    /* top bar */
    #chat-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #chat-topbar-brand {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    #topbar-bird {
      width: 32px; height: 32px;
      object-fit: contain;
    }

    #chat-topbar-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--red);
      letter-spacing: -.01em;
      line-height: 1;
    }

    #new-chat-btn {
      display: flex; align-items: center; gap: .4rem;
      font-family: 'Inter', sans-serif;
      font-size: .8rem; font-weight: 500;
      color: var(--gray);
      background: none; border: 1px solid var(--border);
      border-radius: 999px; padding: .35rem .85rem;
      cursor: pointer; transition: color .15s, border-color .15s;
    }

    #new-chat-btn:hover { color: var(--red); border-color: var(--red); }
    #new-chat-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; }

    /* messages */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.5rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      gap: .65rem;
      align-items: flex-start;
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: .72rem; font-weight: 500;
      flex-shrink: 0; margin-top: 2px;
    }

    .user .avatar   { background: var(--red); color: white; }
    .assistant .avatar {
      background: var(--white);
      color: var(--red);
      border: 1.5px solid var(--border);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .85rem;
      font-weight: 700;
    }

    .bubble {
      max-width: calc(100% - 44px);
      padding: .75rem 1.05rem;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: .9rem;
    }

    .user .bubble {
      background: var(--red);
      color: white;
      border-bottom-right-radius: 4px;
      font-weight: 400;
    }

    .assistant .bubble {
      background: var(--white);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    /* markdown inside assistant bubble */
    .bubble h1, .bubble h2, .bubble h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      margin: .65em 0 .3em;
      font-size: 1.05em;
      letter-spacing: .01em;
    }
    .bubble p { margin-bottom: .5em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 1.4em; margin-bottom: .5em; }
    .bubble li { margin-bottom: .2em; }
    .bubble strong { font-weight: 500; }
    .bubble em { font-style: italic; }
    .bubble code {
      background: var(--cream);
      padding: .1em .35em; border-radius: 4px;
      font-size: .85em; font-family: 'Menlo', monospace;
    }
    .bubble blockquote {
      border-left: 3px solid var(--red);
      padding-left: .75em;
      color: var(--gray);
      margin: .5em 0;
    }
    .bubble a { color: var(--red); }
    .bubble table { border-collapse: collapse; width: 100%; margin: .5em 0; font-size: .85em; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: .35em .6em; text-align: left; }
    .bubble th { background: var(--cream); font-weight: 500; }

    /* source pills */
    .sources { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .65rem; }

    .source-pill {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .7rem; background: var(--cream);
      border: 1px solid var(--border); border-radius: 999px;
      padding: .2rem .65rem; color: var(--gray);
      text-decoration: none; max-width: 240px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      transition: background .15s, color .15s;
    }

    .source-pill:hover { background: var(--red); color: white; border-color: var(--red); }
    .source-pill svg { width: 10px; height: 10px; stroke: currentColor; fill: none; flex-shrink: 0; }

    .live-badge {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .68rem; background: #edf7ee;
      border: 1px solid #b2dfb4; border-radius: 999px;
      padding: .15rem .55rem; color: #2e7d32; font-weight: 500;
    }
    .live-badge::before {
      content: ""; width: 6px; height: 6px;
      background: #4caf50; border-radius: 50%;
    }

    /* typing indicator */
    #typing {
      display: none;
      align-items: flex-start;
      gap: .65rem;
      max-width: var(--max-w); width: 100%;
      margin: 0 auto;
      padding: 0 1.25rem .5rem;
    }
    #typing.active { display: flex; }

    .typing-bubble {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius); border-bottom-left-radius: 4px;
      padding: .85rem 1rem;
      box-shadow: var(--shadow);
    }

    .typing-dots { display: flex; gap: 5px; align-items: center; }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--gray); border-radius: 50%;
      animation: bounce 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(1); opacity: .4; }
      40%            { transform: scale(1.25); opacity: 1; }
    }

    /* ── flying bird loader ─────────────────────────────────────────── */
    #bird-flyer {
      position: fixed;
      top: 44%;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    #bird-flyer.active {
      display: block;
      animation: bird-fly 10s linear forwards;
    }

    #bird-flyer img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      transform: scaleX(-1);
      animation: bird-bob 0.55s ease-in-out infinite;
    }

    @keyframes bird-fly {
      from { transform: translateX(-100px); }
      to   { transform: translateX(calc(100vw + 100px)); }
    }

    @keyframes bird-bob {
      0%, 100% { transform: scaleX(-1) translateY(0px);   }
      50%       { transform: scaleX(-1) translateY(-18px); }
    }

    /* chat input bar (fixed to bottom) */
    #chat-input-area {
      flex-shrink: 0;
      background: var(--cream);
      border-top: 1px solid var(--border);
      padding: .75rem 1.25rem 1rem;
    }

    #chat-input-area .input-row { max-width: var(--max-w); margin: 0 auto; }

    /* ── disclaimer ─────────────────────────────────────────────────── */
    #disclaimer {
      text-align: center;
      font-size: .68rem;
      color: var(--gray);
      padding: .5rem 1rem;
      flex-shrink: 0;
    }

    /* ── responsive ─────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #welcome-screen { padding-bottom: 5rem; justify-content: flex-start; padding-top: 4rem; }
      #welcome-heading { font-size: 3.5rem; }
    }
  </style>
</head>

      <span id="chat-topbar-name">Marty AI</span>
    </div>
    <button id="new-chat-btn" onclick="newChat()">
      <svg viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
  </div>

  <div id="messages"></div>

  <!-- typing indicator -->
  <div id="typing">
    <div class="avatar assistant">M</div>
    <div class="typing-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div id="chat-input-area">
    <div class="input-row">
      <textarea
        id="chat-input"
        rows="1"
        placeholder="Ask me anything about McGill"
        aria-label="Your message"
      ></textarea>
      <button class="send-btn" id="chat-send" disabled title="Send">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Enter to send &middot; Shift+Enter for new line</p>
  </div>

  <p id="disclaimer">Marty AI can make mistakes — always verify with your official McGill advisor.</p>

</div>

<script>
  const API_BASE = "http://localhost:8000";

  // ── state ──────────────────────────────────────────────────────────
  let history = [];
  let isStreaming = false;

  // ── DOM ────────────────────────────────────────────────────────────
  const welcomeScreen  = document.getElementById("welcome-screen");
  const chatScreen     = document.getElementById("chat-screen");
  const messagesEl     = document.getElementById("messages");
  const typingEl       = document.getElementById("typing");
  const welcomeInput   = document.getElementById("welcome-input");
  const welcomeSend    = document.getElementById("welcome-send");
  const chatInput      = document.getElementById("chat-input");
  const chatSend       = document.getElementById("chat-send");
  const birdFlyer      = document.getElementById("bird-flyer");
  const birdFlyerImg   = document.getElementById("bird-flyer-img");

  // Copy bird src from welcome logo once DOM is ready
  birdFlyerImg.src = document.querySelector("#welcome-logo img").src;

  // ── auto-resize helper ─────────────────────────────────────────────
  function autoResize(ta) {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
  }

  function wireInput(ta, btn) {
    ta.addEventListener("input", () => {
      autoResize(ta);
      btn.disabled = ta.value.trim() === "" || isStreaming;
    });
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!btn.disabled) submitMessage(ta.value.trim());
      }
    });
    btn.addEventListener("click", () => {
      if (!btn.disabled) submitMessage(ta.value.trim());
    });
  }

  wireInput(welcomeInput, welcomeSend);
  wireInput(chatInput, chatSend);

  // Clicking anywhere in the input row focuses the textarea
  document.querySelector('#chat-input-area .input-row').addEventListener('click', () => chatInput.focus());
  document.querySelector('#welcome-input-wrap .input-row').addEventListener('click', () => welcomeInput.focus());

  // ── screens ────────────────────────────────────────────────────────
  function showChat() {
    welcomeScreen.style.display = "none";
    chatScreen.style.display = "flex";
    chatInput.focus();
  }

  function newChat() {
    history = [];
    messagesEl.innerHTML = "";
    chatScreen.style.display = "none";
    welcomeScreen.style.display = "";
    welcomeInput.value = "";
    autoResize(welcomeInput);
    welcomeSend.disabled = true;
    welcomeInput.focus();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStreaming(on) {
    isStreaming = on;
    chatSend.disabled = on || chatInput.value.trim() === "";
    welcomeSend.disabled = true;
    typingEl.classList.toggle("active", on);
    if (on) {
      // restart animation by removing and re-adding the class
      birdFlyer.classList.remove("active");
      void birdFlyer.offsetWidth; // force reflow
      birdFlyer.classList.add("active");
      scrollToBottom();
    } else {
      birdFlyer.classList.remove("active");
    }
  }

  // ── markdown via marked.js ─────────────────────────────────────────
  marked.setOptions({
    breaks: true,       // single newline → <br>
    gfm: true,          // GitHub-flavoured (tables, strikethrough, etc.)
  });

  // Open all links in a new tab
  const renderer = new marked.Renderer();
  renderer.link = (href, title, text) =>
    `<a href="${href}" target="_blank" rel="noopener"${title ? ` title="${title}"` : ''}>${text}</a>`;

  function renderMarkdown(text) {
    return marked.parse(text, { renderer });
  }

  // ── append message ─────────────────────────────────────────────────
  function appendMessage(role, content, sources = [], isLive = false) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const av = document.createElement("div");
    av.className = `avatar ${role}`;
    av.textContent = role === "user" ? "You" : "M";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "assistant") {
      bubble.innerHTML = renderMarkdown(content);
      if (sources.length > 0) {
        const sourcesDiv = document.createElement("div");
        sourcesDiv.className = "sources";
        if (isLive) {
          const badge = document.createElement("span");
          badge.className = "live-badge";
          badge.textContent = "Live";
          sourcesDiv.appendChild(badge);
        }
        sources.forEach(url => {
          const a = document.createElement("a");
          a.className = "source-pill";
          a.href = url; a.target = "_blank"; a.rel = "noopener"; a.title = url;
          a.innerHTML = `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>${new URL(url).pathname.replace(/\/$/, "") || url}`;
          sourcesDiv.appendChild(a);
        });
        bubble.appendChild(sourcesDiv);
      }
    } else {
      bubble.textContent = content;
    }

    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  // ── stream ─────────────────────────────────────────────────────────
  async function streamMessage(userText) {
    showChat();
    appendMessage("user", userText);
    setStreaming(true);

    const row = document.createElement("div");
    row.className = "msg-row assistant";
    const av = document.createElement("div");
    av.className = "avatar assistant";
    av.textContent = "M";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.setAttribute("aria-live", "polite");
    row.appendChild(av);
    row.appendChild(bubble);

    let rawText = "", sources = [], isLive = false;

    try {
      const response = await fetch(`${API_BASE}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userText, history }),
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      messagesEl.appendChild(row);
      setStreaming(false);
      isStreaming = true;
      chatSend.disabled = true;

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      stream: while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();

        for (const part of parts) {
          const lines = part.split("\n");
          let eventType = "", dataStr = "";
          for (const line of lines) {
            if (line.startsWith("event: ")) eventType = line.slice(7);
            if (line.startsWith("data: "))  dataStr  = line.slice(6);
          }
          if (!dataStr) continue;
          let data;
          try { data = JSON.parse(dataStr); } catch { continue; }

          if (eventType === "meta") {
            sources = data.sources || [];
            isLive  = data.is_live || false;
          } else if (eventType === "text") {
            rawText += data.text || "";
            bubble.innerHTML = renderMarkdown(rawText);
            scrollToBottom();
          } else if (eventType === "error") {
            bubble.innerHTML = `<em style="color:var(--red)">⚠️ ${data.message}</em>`;
            break stream;
          } else if (eventType === "done") {
            break stream;
          }
        }
      }

      // append sources
      if (sources.length > 0) {
        const sourcesDiv = document.createElement("div");
        sourcesDiv.className = "sources";
        if (isLive) {
          const badge = document.createElement("span");
          badge.className = "live-badge";
          badge.textContent = "Live";
          sourcesDiv.appendChild(badge);
        }
        sources.forEach(url => {
          const a = document.createElement("a");
          a.className = "source-pill";
          a.href = url; a.target = "_blank"; a.rel = "noopener"; a.title = url;
          try {
            const path = new URL(url).pathname.replace(/\/$/, "") || url;
            a.innerHTML = `<svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>${path}`;
          } catch { a.textContent = url; }
          sourcesDiv.appendChild(a);
        });
        bubble.appendChild(sourcesDiv);
      }

      history.push({ role: "user", content: userText });
      history.push({ role: "assistant", content: rawText });

    } catch (err) {
      console.error(err);
      if (!messagesEl.contains(row)) messagesEl.appendChild(row);
      bubble.innerHTML = `<em style="color:var(--red)">⚠️ Could not reach the server. Make sure the backend is running at <code>${API_BASE}</code>.</em>`;
    } finally {
      setStreaming(false);
      isStreaming = false;
      chatSend.disabled = chatInput.value.trim() === "";
      scrollToBottom();
      chatInput.focus();
    }
  }

  // ── submit ─────────────────────────────────────────────────────────
  function submitMessage(text) {
    if (!text || isStreaming) return;
    welcomeInput.value = "";
    chatInput.value = "";
    autoResize(welcomeInput);
    autoResize(chatInput);
    chatSend.disabled = true;
    streamMessage(text);
  }
</script>

</body>
</html>
